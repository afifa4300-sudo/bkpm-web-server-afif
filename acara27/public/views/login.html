<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Informasi Akademik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0 fw-bold">Login Sistem Akademik</h4>
                        <small>Role-Based Access Control (RBAC)</small>
                    </div>
                    <div class="card-body p-4">
                        <div id="alert-box" class="alert" style="display: none;"></div>

                        <form id="form-login">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <input type="text" class="form-control" id="username" placeholder="Masukkan username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                            </div>
                            <button type="submit" id="btn-login" class="btn btn-primary w-100 py-2 fw-semibold">Masuk Sekarang</button>
                        </form>
                    </div>
                    <div class="card-footer bg-white text-center py-3 small text-muted">
                        Praktikum Acara 25: Polije PSDKU Nganjuk
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
