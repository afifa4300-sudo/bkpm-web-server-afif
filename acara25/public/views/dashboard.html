<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Sistem Informasi Akademik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Langkah 4: Proteksi View Dashboard -->
    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = 'login.html';
        }
    </script>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Dashboard SI Akademik</a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3">Halo, <strong id="user-display"></strong> (<span id="role-display" class="badge bg-info"></span>)</span>
                <!-- Tugas Praktik Mandiri 1: Tombol Logout -->
                <button class="btn btn-sm btn-outline-danger" onclick="prosesLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Langkah 5: Ringkasan Total Data Mahasiswa -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card bg-primary text-white shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="text-uppercase fw-semibold">Total Mahasiswa</h6>
                        <h2 class="display-6 fw-bold mb-0" id="total-mahasiswa">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card bg-white shadow-sm border-0 h-100 d-flex justify-content-center px-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1 fw-bold text-dark">Status Akses Akun</h6>
                            <p class="text-muted small mb-0" id="role-explanation">Hak akses Anda ditentukan oleh sistem RBAC.</p>
                        </div>
                        <!-- Tugas Praktik Mandiri 2: Tombol Aksi Admin yang disembunyikan jika role=user -->
                        <div id="admin-actions">
                            <button class="btn btn-success fw-semibold" onclick="alert('Fitur tambah/ubah/hapus aktif untuk admin!')">+ Tambah Mahasiswa</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-dark">Data Mahasiswa</h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="muatData()">Refresh</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-bordered align-middle" id="tabel-data">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>NIM</th>
                                <th>Nama Lengkap</th>
                                <th>Program Studi</th>
                                <th class="admin-column">Aksi (Admin)</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost/bkpm-web-server-afif/acara25/public';
        const role = localStorage.getItem('role') || 'user';
        const username = localStorage.getItem('username') || 'Pengguna';

        document.getElementById('user-display').innerText = username;
        const roleBadge = document.getElementById('role-display');
        roleBadge.innerText = role.toUpperCase();

        // Tugas Praktik Mandiri 2: Sembunyikan tombol Tambah/Aksi jika role adalah user
        if (role !== 'admin') {
            document.getElementById('admin-actions').style.display = 'none';
            document.querySelectorAll('.admin-column').forEach(el => el.style.display = 'none');
            document.getElementById('role-explanation').innerText = 'Anda login sebagai User (Hanya berhak membaca data / Read-Only).';
            roleBadge.className = 'badge bg-secondary';
        } else {
            document.getElementById('role-explanation').innerText = 'Anda login sebagai Admin (Hak penuh Create, Read, Update, Delete).';
            roleBadge.className = 'badge bg-success';
        }

        async function muatData() {
            try {
                const res = await fetch(`${BASE_URL}/mahasiswa`);
                const hasil = await res.json();
                const tbody = document.querySelector('#tabel-data tbody');
                tbody.innerHTML = '';

                // Langkah 5: Hitung total mahasiswa
                document.getElementById('total-mahasiswa').innerText = hasil.data ? hasil.data.length : 0;

                if (!hasil.data || hasil.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Belum ada data</td></tr>';
                    return;
                }

                hasil.data.forEach((mhs, idx) => {
                    const actionButtons = role === 'admin' 
                        ? `<button class="btn btn-sm btn-warning me-1" onclick="alert('Edit ID: ${mhs.id}')">Edit</button>
                           <button class="btn btn-sm btn-danger" onclick="alert('Hapus ID: ${mhs.id}')">Hapus</button>`
                        : '';

                    tbody.innerHTML += `
                        <tr>
                            <td>${idx + 1}</td>
                            <td><strong>${mhs.nim}</strong></td>
                            <td>${mhs.nama}</td>
                            <td><span class="badge bg-primary">${mhs.prodi}</span></td>
                            ${role === 'admin' ? `<td>${actionButtons}</td>` : ''}
                        </tr>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }

        // Tugas Praktik Mandiri 1: Fungsi Logout
        function prosesLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            localStorage.removeItem('username');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', muatData);
    </script>
</body>
</html>
