$kind: http-request
name: "TC-02: Login Password Salah (401 Unauthorized)"
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "admin",
        "password": "pass_salah"
    }
scripts:
  - type: afterResponse
    code: pm.test('TC-02 Status 401 Unauthorized', function() { pm.response.to.have.status(401); });
    language: text/javascript
order: 2000
