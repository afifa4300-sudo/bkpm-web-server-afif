$kind: http-request
name: "TC-01: Login Kredensial Valid (200 OK)"
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "admin",
        "password": "admin123"
    }
scripts:
  - type: afterResponse
    code: pm.test('TC-01 Status 200 OK', function() { pm.response.to.have.status(200); var res = pm.response.json(); pm.environment.set('token', res.data.token); });
    language: text/javascript
order: 1000
