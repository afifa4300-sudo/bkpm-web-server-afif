$kind: http-request
name: 1. POST /register (Sukses 201 Created)
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "afif_tester",
        "email": "afif_tester@example.com",
        "password": "secret123",
        "role": "admin"
    }
scripts:
  - type: afterResponse
    code: pm.test('Register success 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
