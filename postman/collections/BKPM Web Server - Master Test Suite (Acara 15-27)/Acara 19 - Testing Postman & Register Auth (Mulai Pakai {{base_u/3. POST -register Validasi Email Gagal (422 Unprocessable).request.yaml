$kind: http-request
name: 3. POST /register Validasi Email Gagal (422 Unprocessable)
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "budi_salah",
        "email": "bukan-email-valid",
        "password": "123"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 422 Unprocessable Entity', function () { pm.response.to.have.status(422); });
    language: text/javascript
order: 3000
