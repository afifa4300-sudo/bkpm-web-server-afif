$kind: http-request
name: "TC-05: Register Email Invalid (422 Unprocessable)"
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "invalid_email_user",
        "email": "format-email-salah",
        "password": "password123"
    }
scripts:
  - type: afterResponse
    code: pm.test('TC-05 Status 422 Unprocessable', function() { pm.response.to.have.status(422); });
    language: text/javascript
order: 5000
