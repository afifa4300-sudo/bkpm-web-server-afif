$kind: http-request
name: "TC-09: POST /mahasiswa Valid dengan Bearer Token (201 Created)"
url: "{{base_url}}/mahasiswa"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
        "nim": "E41237210",
        "nama": "Mahasiswa QA Valid",
        "prodi": "Teknik Informatika",
        "angkatan": 2024
    }
scripts:
  - type: afterResponse
    code: pm.test('TC-09 Status 201 Created', function() { pm.response.to.have.status(201); });
    language: text/javascript
order: 9000
