$kind: http-request
name: 3. POST /mahasiswa Tanpa Token (401 Unauthorized)
url: "{{base_url}}/mahasiswa"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nim": "E41250911",
        "nama": "No Token",
        "prodi": "TI",
        "angkatan": 2024
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 401 Unauthorized', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 3000
