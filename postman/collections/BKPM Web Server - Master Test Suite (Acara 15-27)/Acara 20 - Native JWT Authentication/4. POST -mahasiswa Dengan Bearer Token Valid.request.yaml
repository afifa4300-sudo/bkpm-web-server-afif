$kind: http-request
name: 4. POST /mahasiswa Dengan Bearer Token Valid
url: "{{base_url}}/mahasiswa"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
        "nim": "E41250911",
        "nama": "With Valid Token",
        "prodi": "TI",
        "angkatan": 2024
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 201 Created', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 4000
