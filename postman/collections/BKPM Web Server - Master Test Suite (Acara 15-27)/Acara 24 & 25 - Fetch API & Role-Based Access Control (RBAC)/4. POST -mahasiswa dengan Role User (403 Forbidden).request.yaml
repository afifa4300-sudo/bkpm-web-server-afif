$kind: http-request
name: 4. POST /mahasiswa dengan Role User (403 Forbidden)
url: "{{base_url}}/mahasiswa"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{user_token}}
body:
  type: json
  content: |-
    {
        "nim": "E41250777",
        "nama": "User Trying to Create",
        "prodi": "TI",
        "angkatan": 2024
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 403 Forbidden', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 4000
