$kind: http-request
url: "{{baseUrl}}/api/orders"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Scope all', () => pm.expect(pm.response.json().meta.scope).to.eql('all'));
    language: text/javascript
order: 5000
