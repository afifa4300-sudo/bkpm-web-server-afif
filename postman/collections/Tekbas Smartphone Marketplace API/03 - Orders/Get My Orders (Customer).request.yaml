$kind: http-request
url: "{{baseUrl}}/api/orders"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Scope own dan ada data', () => {
        const body = pm.response.json();
        pm.expect(body.meta.scope).to.eql('own');
        pm.expect(body.meta.total).to.be.above(0);
      });
    language: text/javascript
order: 3000
