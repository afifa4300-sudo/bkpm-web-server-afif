$kind: http-request
url: "{{baseUrl}}/api/orders/{{orderId}}/status"
method: PATCH
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "diproses"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Status menjadi diproses', () => pm.expect(pm.response.json().data.order.status).to.eql('diproses'));
    language: text/javascript
order: 6000
