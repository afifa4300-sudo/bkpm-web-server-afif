$kind: http-request
url: "{{baseUrl}}/api/orders/{{orderId}}"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('ID pesanan sesuai', () => pm.expect(pm.response.json().data.order._id).to.eql(pm.environment.get('orderId')));
    language: text/javascript
order: 4000
