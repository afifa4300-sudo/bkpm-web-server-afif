$kind: http-request
url: "{{baseUrl}}/api/products/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const stockBefore = Number(pm.environment.get('productStock'));
      const currentStock = pm.response.json().data.product.stok;
      pm.test('Stok berkurang 2', () => pm.expect(currentStock).to.eql(stockBefore - 2));
      pm.environment.set('productStock', currentStock);
    language: text/javascript
order: 2000
