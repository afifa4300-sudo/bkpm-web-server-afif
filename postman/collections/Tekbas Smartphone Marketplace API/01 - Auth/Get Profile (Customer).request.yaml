$kind: http-request
url: "{{baseUrl}}/api/auth/profile"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Email sesuai', () => pm.expect(pm.response.json().data.user.email).to.eql(pm.environment.get('customerEmail')));
    language: text/javascript
order: 4000
