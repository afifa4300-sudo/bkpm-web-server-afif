$kind: http-request
url: "{{baseUrl}}/api/products/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('ID sesuai', () => pm.expect(pm.response.json().data.product._id).to.eql(pm.environment.get('productId')));
    language: text/javascript
order: 4000
