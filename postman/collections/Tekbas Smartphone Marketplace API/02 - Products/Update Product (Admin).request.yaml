$kind: http-request
url: "{{baseUrl}}/api/products/{{productId}}"
method: PUT
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "harga": 19500000,
      "deskripsi": "Harga promo terbaru."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Harga berubah', () => pm.expect(pm.response.json().data.product.harga).to.eql(19500000));
    language: text/javascript
order: 5000
