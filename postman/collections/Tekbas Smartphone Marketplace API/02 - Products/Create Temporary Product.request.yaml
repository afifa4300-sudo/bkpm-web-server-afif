$kind: http-request
url: "{{baseUrl}}/api/products"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nama": "Produk Sementara {{$timestamp}}",
      "brand": "Test",
      "harga": 1000000,
      "stok": 1,
      "deskripsi": "Produk untuk uji delete.",
      "spesifikasi": { "catatan": "sementara" }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 Created', () => pm.response.to.have.status(201));
      pm.environment.set('tempProductId', pm.response.json().data.product._id);
    language: text/javascript
order: 6000
