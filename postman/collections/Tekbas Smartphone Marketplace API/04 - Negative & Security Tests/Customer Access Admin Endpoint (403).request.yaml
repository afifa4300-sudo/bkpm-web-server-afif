$kind: http-request
url: "{{baseUrl}}/api/products"
method: POST
headers:
  Authorization: Bearer {{customerToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nama": "Tidak Boleh",
      "brand": "Test",
      "harga": 1000,
      "stok": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 403 Forbidden', () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
