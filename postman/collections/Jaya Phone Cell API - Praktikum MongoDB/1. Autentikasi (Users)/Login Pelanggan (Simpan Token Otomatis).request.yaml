$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "budi@gmail.com",
      "password": "budi123"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.environment.set("pelanggan_token", jsonData.token);
          console.log("pelanggan_token tersimpan otomatis ke Environment");
      }
    language: text/javascript
order: 4000
