<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Akademik - Data Mahasiswa (Acara 24)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">SI Akademik (Client-Side Fetch API)</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-primary">Daftar Mahasiswa Terdaftar</h5>
                <button class="btn btn-sm btn-outline-primary" onclick="muatDataMahasiswa()">
                    Refresh Data
                </button>
            </div>
            <div class="card-body">
                <!-- Tugas Mandiri 1: Indikator Loading -->
                <div id="loading-indicator" class="text-center py-4" style="display: none;">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted fw-semibold">Memuat data...</p>
                </div>

                <!-- Tugas Mandiri 2: Empty State Alert -->
                <div id="empty-state" class="alert alert-info text-center" style="display: none;">
                    Belum ada data mahasiswa yang tersimpan di sistem.
                </div>

                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle" id="tabel-mahasiswa">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 50px;">#</th>
                                <th>NIM</th>
                                <th>Nama Lengkap</th>
                                <th>Program Studi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data akan diinjeksi secara asinkronus oleh app.js -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white text-muted small text-center py-2">
                Praktikum Acara 24: Integrasi JavaScript Fetch API & CORS
            </div>
        </div>
    </div>

    <!-- Script App JS -->
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
